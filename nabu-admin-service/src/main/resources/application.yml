server:
  port: 18091

spring:
  # Spring Cloud 2021+ 起：classpath 上有 nacos-config 就必须显式声明 spring.config.import，
  # 否则启动直接失败（No spring.config.import property has been defined）。
  # optional: 前缀 = Nacos 里还没建这个 dataId 时也不阻塞本地启动。
  config:
    import: optional:nacos:nabu-admin-service.yaml
  application:
    name: nabu-admin-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD}
            dataId: ${spring.application.name}-flow-rules
            groupId: DEFAULT_GROUP
            rule-type: flow

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
  protocol:
    name: tri
    port: 28091
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    register-mode: instance
    parameters:
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.xfy.nabu: debug
