server:
  port: 18082

spring:
  # Spring Cloud 2021+ 起：classpath 上有 nacos-config 就必须显式声明 spring.config.import，
  # 否则启动直接失败（No spring.config.import property has been defined）。
  # optional: 前缀 = Nacos 里还没建这个 dataId 时也不阻塞本地启动。
  config:
    import: optional:nacos:nabu-auth-service.yaml
  application:
    name: nabu-auth-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      # 各服务用不同 database 隔离，本服务专用 database=2（存 refresh token）
      database: 2

dubbo:
  scan:
    base-packages: com.xfy.nabu.auth.dubbo
  application:
    name: ${spring.application.name}
    logger: slf4j
  protocol:
    name: tri
    port: 28082
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    register-mode: instance
    parameters:
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}

nabu:
  jwt:
    # 无兜底值：密钥只能由环境变量注入（容器侧 compose.app.yml，
    # 裸机侧 source deploy/scripts/dev-env.sh）。仓库内不留默认密钥：
    # 留着会让漏配时静默用一个已入仓历史公开的弱密钥签发 token。
    secret: ${JWT_SECRET}
    access-token-expire-minutes: 30
    refresh-token-expire-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.xfy.nabu: debug
