server:
  port: 18081

spring:
  # Spring Cloud 2021+ 起：classpath 上有 nacos-config 就必须显式声明 spring.config.import，
  # 否则启动直接失败（No spring.config.import property has been defined）。
  # optional: 前缀 = Nacos 里还没建这个 dataId 时也不阻塞本地启动。
  config:
    import: optional:nacos:nabu-user-service.yaml
  application:
    name: nabu-user-service
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yaml
      discovery:
        server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
        namespace: ${NACOS_NAMESPACE:}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      datasource:
        ds1:
          nacos:
            server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
            username: ${NACOS_USERNAME:nacos}
            password: ${NACOS_PASSWORD}
            dataId: ${spring.application.name}-flow-rules
            groupId: DEFAULT_GROUP
            rule-type: flow
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_USER_HOST:127.0.0.1}:${MYSQL_USER_PORT:3307}/nabu_user?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER_USERNAME:admin}
    password: ${MYSQL_USER_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      stat-view-servlet:
        enabled: true
        login-username: admin
        # 监控台口令只放 deploy/.env（compose.app.yml 注入）；裸机跑先 source dev-env.sh。
        login-password: ${DRUID_MONITOR_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD}
      database: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  scan:
    base-packages: com.xfy.nabu.user.dubbo
  application:
    name: ${spring.application.name}
    logger: slf4j
  protocol:
    name: tri
    port: 28081
  registry:
    address: nacos://${NACOS_ADDRESS:127.0.0.1}:8848
    register-mode: instance
    parameters:
      namespace: ${NACOS_NAMESPACE:}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}

seata:
  enabled: true
  application-id: ${spring.application.name}
  tx-service-group: nabu-tx-group
  service:
    vgroup-mapping:
      nabu-tx-group: default
    grouplist:
      default: ${SEATA_ADDRESS:127.0.0.1:8091}
  registry:
    type: nacos
    nacos:
      server-addr: ${NACOS_ADDRESS:127.0.0.1}:8848
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD}
      namespace: ${NACOS_NAMESPACE:}
      group: SEATA_GROUP

jetcache:
  statIntervalMinutes: 15
  local:
    default:
      type: caffeine
      keyConvertor: fastjson2
      limit: 1000
  remote:
    default:
      type: redisson
      keyConvertor: fastjson2
      broadcastChannel: ${spring.application.name}-jetcache
      valueEncoder: java
      valueDecoder: java
      # JetCache 走 Redisson 自建连接，不读 spring.data.redis.password，
      # 所以 Redis 开了 requirepass 后口令必须写进这个 uri。
      # 注意：口令含 @ : / 等字符时需先做 URL 编码。
      uri: "redis://:${REDIS_PASSWORD}@${REDIS_HOST:127.0.0.1}\
            :${REDIS_PORT:6380}/1"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.xfy.nabu: debug
