# =====================================================================================
# 中间件层：Nacos（注册+配置中心）、Sentinel Dashboard、RocketMQ、Seata、Canal、Higress。
# =====================================================================================
name: nabu

services:

  # ---------------------------------------------------------------------------------
  # Nacos：单机模式，同时承担服务注册发现与动态配置中心。
  # ---------------------------------------------------------------------------------
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: nabu-nacos
    restart: unless-stopped
    environment:
      - MODE=standalone
      - JVM_XMS=256m
      - JVM_XMX=512m
      - JVM_XMN=128m
      # 鉴权总开关：镜像的 docker-startup.sh 会把它翻译成 -Dnacos.core.auth.enabled。
      # 默认打开；只有要临时绕过时（如首次改内置 nacos 账号口令）才用 shell 变量覆盖成 false。
      - NACOS_AUTH_ENABLE=${NACOS_AUTH_ENABLE:-true}
      # Nacos 3 的启动脚本始终要求这三项（缺失直接 exit 255，与是否开鉴权无关）。
      # 这里刻意不给默认值：仓库内一旦留示例值，新环境照模板留空就会静默用公开签名密钥启动，
      # 所以改成 fail-fast，缺键时在 up 阶段就报错，而不是等容器 exit 255。
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:?deploy/.env 未配置 NACOS_AUTH_TOKEN}
      - NACOS_AUTH_IDENTITY_KEY=${NACOS_AUTH_IDENTITY_KEY:?deploy/.env 未配置}
      - NACOS_AUTH_IDENTITY_VALUE=${NACOS_AUTH_IDENTITY_VALUE:?deploy/.env 未配置}
      - PREFER_HOST_MODE=hostname
    ports:
      - "8848:8848"
      - "8849:8080" # Nacos 3 控制台独立端口，避开 Higress 的宿主机 8080。
      - "9848:9848"
      - "9849:9849"
    volumes:
      - ./data/nacos/logs:/home/nacos/logs
      - ./data/nacos/data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8848/nacos/v3/admin/core/state/readiness || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [nabu-net]

  # ---------------------------------------------------------------------------------
  # Sentinel Dashboard：流控/熔断规则可视化配置与实时监控。
  # ---------------------------------------------------------------------------------
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.9
    container_name: nabu-sentinel-dashboard
    restart: unless-stopped
    ports:
      - "8858:8858"
    environment:
      # 注意：不能用 JAVA_OPTS 传 -D 参数，该镜像 entrypoint 不读 JAVA_OPTS；
      # 且镜像内属性前缀是 auth.*（见 app.jar 的 application.properties），
      # 不是上游文档里的 sentinel.dashboard.auth.*。这里用 Spring 宽松绑定的环境变量覆盖。
      - AUTH_USERNAME=admin
      # 面板登录口令只放 deploy/.env，仓库内不留明文。
      - AUTH_PASSWORD=${SENTINEL_AUTH_PASSWORD:?deploy/.env 未配置}
    networks: [nabu-net]

  # ---------------------------------------------------------------------------------
  # RocketMQ 5.x：NameServer + Broker + Proxy（Producer/Consumer 通过 Proxy 统一接入）。
  # ---------------------------------------------------------------------------------
  rmqnamesrv:
    image: apache/rocketmq:5.3.1
    container_name: nabu-rmqnamesrv
    restart: unless-stopped
    ports:
      - "9876:9876"
    environment:
      - HEAP_OPTS=-Xms128m -Xmx256m -Xmn64m
    command: sh mqnamesrv
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/9876"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [nabu-net]

  rmqbroker:
    image: apache/rocketmq:5.3.1
    container_name: nabu-rmqbroker
    restart: unless-stopped
    depends_on:
      rmqnamesrv:
        condition: service_healthy
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      # 单机部署，brokerIP1 设为容器服务名，仅供 compose 内部网络访问。
      - JAVA_OPT_EXT=-Xms512m -Xmx512m
    volumes:
      - ./config/rocketmq/broker.conf:/opt/rocketmq/conf/broker.conf
      - ./data/rocketmq/broker/logs:/home/rocketmq/logs
      - ./data/rocketmq/broker/store:/home/rocketmq/store
    command: sh mqbroker -c /opt/rocketmq/conf/broker.conf
    healthcheck:
      # Proxy 需要已注册到 NameServer 的 Broker，仅端口监听还不足以创建系统主题。
      test: ["CMD-SHELL", "JAVA_OPT_EXT='-Xms32m -Xmx64m -Xmn16m' sh mqadmin clusterList -n rmqnamesrv:9876 | grep -qE '^DefaultCluster[[:space:]]+broker-a[[:space:]].*[[:space:]]true[[:space:]]*$'"]
      interval: 20s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks: [nabu-net]

  rmqproxy:
    image: apache/rocketmq:5.3.1
    container_name: nabu-rmqproxy
    restart: unless-stopped
    depends_on:
      rmqbroker:
        condition: service_healthy
      rmqnamesrv:
        condition: service_healthy
    ports:
      - "8081:8081"
      - "8082:8080"
    environment:
      - NAMESRV_ADDR=rmqnamesrv:9876
      - JAVA_OPT_EXT=-Xms128m -Xmx256m -Xmn64m
    command: sh mqproxy
    networks: [nabu-net]

  rmqdashboard:
    image: apacherocketmq/rocketmq-dashboard@sha256:ce78506bd6fe01095bf1b37c954625e363ba5afae5d1539b77f395785d445e33
    container_name: nabu-rmqdashboard
    restart: unless-stopped
    depends_on:
      - rmqnamesrv
    ports:
      - "9878:8080"
    environment:
      - JAVA_OPTS=-Xms64m -Xmx256m -Dserver.port=8080 -Drocketmq.namesrv.addr=rmqnamesrv:9876
    networks: [nabu-net]

  # ---------------------------------------------------------------------------------
  # Seata Server：AT 模式分布式事务协调器（TC）。
  # 注册到 Nacos，各服务 seata.registry.type=nacos 与之对应。
  # ---------------------------------------------------------------------------------
  seata-server:
    image: apache/seata-server:2.5.0
    container_name: nabu-seata-server
    restart: unless-stopped
    depends_on:
      nacos:
        condition: service_healthy
    ports:
      - "8091:8091"
      - "7091:7091"
    environment:
      - SEATA_PORT=8091
      - STORE_MODE=file
      - SEATA_IP=seata-server
      - JVM_XMS=128m
      - JVM_XMX=512m
      - JVM_MaxDirectMemorySize=128m
      - SEATA_REGISTRY_TYPE=nacos
      - SEATA_REGISTRY_NACOS_SERVER_ADDR=nacos:8848
      - SEATA_REGISTRY_NACOS_GROUP=SEATA_GROUP
      - SEATA_REGISTRY_NACOS_APPLICATION=seata-server
      - SEATA_REGISTRY_NACOS_CLUSTER=default
      # Nacos 开鉴权后 TC 注册也要带账号。RegistryNacosProperties 只有 username/password，
      # 没有 auth 前缀；写成 SEATA_REGISTRY_NACOS_AUTH_* 会被 relaxed binding 静默忽略。
      - SEATA_REGISTRY_NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - SEATA_REGISTRY_NACOS_PASSWORD=${NACOS_PASSWORD:?deploy/.env 未配置}
      # 本地事务参数使用文件配置，不依赖尚未导入 Nacos 的配置项。
      - SEATA_CONFIG_TYPE=file
    volumes:
      - ./data/seata:/root/seata-server/data
    healthcheck:
      test: ["CMD", "bash", "-c", ": > /dev/tcp/127.0.0.1/8091"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [nabu-net]

  # ---------------------------------------------------------------------------------
  # Canal Server：监听 mysql-forum 的 binlog（用于 t_topic -> Elasticsearch 索引同步）。
  # 注意：MySQL 容器需要开启 binlog（row 格式）并授予 canal 账号 REPLICATION 权限，
  # 详见 deploy/config/mysql/init/ 下的初始化脚本；本 canal-server 的实例配置见
  # deploy/config/canal/（如需真实运行，请参考 docs/canal-setup.md 补充账号与 instance.properties）。
  # ---------------------------------------------------------------------------------
  canal-server:
    image: canal/canal-server:latest
    container_name: nabu-canal-server
    restart: unless-stopped
    depends_on:
      - mysql-forum
    ports:
      - "11111:11111"
      - "11112:11112"
    environment:
      - canal.auto.scan=false
    networks: [nabu-net]

  # ---------------------------------------------------------------------------------
  # Higress：Docker All-in-One 单容器模式（网关 + 控制台），单机简化部署。
  # ---------------------------------------------------------------------------------
  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:latest
    container_name: nabu-higress
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8080:8080"
      - "18443:8443"
    volumes:
      - ./data/higress:/data
    networks: [nabu-net]

networks:
  nabu-net:
    name: nabu-net
    driver: bridge
