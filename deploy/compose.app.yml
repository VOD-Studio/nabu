# =====================================================================================
# 应用层：13 个 Java 微服务。全部使用同一份根 Dockerfile，通过 build.args.MODULE 区分。
#
# 注意：
# - 本文件里的环境变量覆盖各服务 application.yml 里的裸机默认值（127.0.0.1:xxxx），
#   改为 compose 内部服务名，实现容器网络互通，具体环境变量含义见 deploy/.env 注释。
# - 生产不会这样直接把全部服务塞进一个 compose，这里是为了本地一键拉起全链路便于联调。
# =====================================================================================
name: nabu

services:

  nabu-user-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-user-service
    container_name: nabu-user-service
    restart: unless-stopped
    ports:
      - "18081:18081"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - SEATA_ADDRESS=${SEATA_ADDRESS}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_USER_HOST=${MYSQL_USER_HOST}
      - MYSQL_USER_PORT=${MYSQL_USER_PORT}
      - MYSQL_USER_USERNAME=${MYSQL_USER_USERNAME}
      - MYSQL_USER_PASSWORD=${MYSQL_USER_PASSWORD}
    depends_on:
      - mysql-user
      - redis
      - nacos
    networks: [nabu-net]

  nabu-auth-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-auth-service
    container_name: nabu-auth-service
    restart: unless-stopped
    ports:
      - "18082:18082"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - redis
      - nacos
    networks: [nabu-net]

  nabu-forum-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-forum-service
    container_name: nabu-forum-service
    restart: unless-stopped
    ports:
      - "18083:18083"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - SEATA_ADDRESS=${SEATA_ADDRESS}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_FORUM_HOST=${MYSQL_FORUM_HOST}
      - MYSQL_FORUM_PORT=${MYSQL_FORUM_PORT}
      - MYSQL_FORUM_USERNAME=${MYSQL_FORUM_USERNAME}
      - MYSQL_FORUM_PASSWORD=${MYSQL_FORUM_PASSWORD}
    depends_on:
      - mysql-forum
      - redis
      - nacos
      - rmqnamesrv
      - seata-server
    networks: [nabu-net]

  nabu-social-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-social-service
    container_name: nabu-social-service
    restart: unless-stopped
    ports:
      - "18084:18084"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    depends_on:
      - redis
      - nacos
      - rmqnamesrv
    networks: [nabu-net]

  nabu-notify-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-notify-service
    container_name: nabu-notify-service
    restart: unless-stopped
    ports:
      - "18085:18085"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - MYSQL_NOTIFY_HOST=${MYSQL_NOTIFY_HOST}
      - MYSQL_NOTIFY_PORT=${MYSQL_NOTIFY_PORT}
      - MYSQL_NOTIFY_USERNAME=${MYSQL_NOTIFY_USERNAME}
      - MYSQL_NOTIFY_PASSWORD=${MYSQL_NOTIFY_PASSWORD}
    depends_on:
      - mysql-notify
      - nacos
      - rmqnamesrv
    networks: [nabu-net]

  nabu-search-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-search-service
    container_name: nabu-search-service
    restart: unless-stopped
    ports:
      - "18086:18086"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - ELASTICSEARCH_URIS=${ELASTICSEARCH_URIS}
    depends_on:
      - elasticsearch
      - nacos
      - rmqnamesrv
    networks: [nabu-net]

  nabu-file-service:
