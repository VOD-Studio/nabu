# =====================================================================================
# 应用层：13 个 Java 微服务。全部使用同一份根 Dockerfile，通过 build.args.MODULE 区分。
#
# 注意：
# - 本文件里的环境变量覆盖各服务 application.yml 里的裸机默认值（127.0.0.1:xxxx），
#   改为 compose 内部服务名，实现容器网络互通，具体环境变量含义见 deploy/.env 注释。
# - 生产不会这样直接把全部服务塞进一个 compose，这里是为了本地一键拉起全链路便于联调。
# =====================================================================================
# ---------------------------------------------------------------------------------
# 内存预算提醒：本机 Docker VM 约 5.8 GiB。12 个应用容器默认各限 1g（堆按 60% 自适应，
# 常驻 RSS 通常 400~600M），再叠加 ES(512M 堆) + 5×MySQL + RocketMQ 三件套 + Seata +
# Canal + Higress + 可观测性栈，`up.sh all` 一次性全起仍会超卖。日常联调按需起：
#   docker compose ... up -d nabu-user-service nabu-web
# 两个可调旋钮（写在 deploy/.env，或用环境变量临时覆盖）：
#   APP_MEM_LIMIT  单容器内存上限，默认 1g
#   JAVA_OPTS      JVM 参数，默认 -XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError
# ---------------------------------------------------------------------------------
name: nabu

services:

  nabu-user-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-user-service
    container_name: nabu-user-service
    restart: unless-stopped
    # 单容器内存上限，可用 deploy/.env 的 APP_MEM_LIMIT 统一调（默认 1g）
    mem_limit: "${APP_MEM_LIMIT:-1g}"
    ports:
      - "18081:18081"
    environment:
      # Dockerfile 的 ENTRYPOINT 会展开 $JAVA_OPTS：堆按容器上限自适应，
      # OOM 时直接退出交给 restart 策略，而不是拖死整个 Docker VM
      - "JAVA_OPTS=${JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError}"
      # 本地允许分组启动；缺失的 RPC 提供者仍会在调用时报告不可用。
      - DUBBO_CONSUMER_CHECK=${DUBBO_CONSUMER_CHECK:-false}
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - SEATA_ADDRESS=${SEATA_ADDRESS}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - MYSQL_USER_HOST=${MYSQL_USER_HOST}
      - MYSQL_USER_PORT=${MYSQL_USER_PORT}
      - MYSQL_USER_USERNAME=${MYSQL_USER_USERNAME}
      - MYSQL_USER_PASSWORD=${MYSQL_USER_PASSWORD}
    # 有健康检查的依赖等待 service_healthy；其余依赖等待进程启动。
    # 分组联调时只拉起本服务声明的依赖。
    depends_on:
      mysql-user:
        condition: service_healthy
      seata-server:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    networks: [nabu-net]

