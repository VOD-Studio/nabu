      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - MYSQL_FILE_HOST=${MYSQL_FILE_HOST}
      - MYSQL_FILE_PORT=${MYSQL_FILE_PORT}
      - MYSQL_FILE_USERNAME=${MYSQL_FILE_USERNAME}
      - MYSQL_FILE_PASSWORD=${MYSQL_FILE_PASSWORD}
      - RUSTFS_ENDPOINT=${RUSTFS_ENDPOINT}
      - RUSTFS_ACCESS_KEY=${RUSTFS_ACCESS_KEY}
      - RUSTFS_SECRET_KEY=${RUSTFS_SECRET_KEY}
      - RUSTFS_BUCKET=${RUSTFS_BUCKET}
    depends_on:
      - mysql-file
