    container_name: nabu-moderation-service
    restart: unless-stopped
    ports:
      - "18088:18088"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
      - ROCKETMQ_NAMESRV=${ROCKETMQ_NAMESRV}
      - MYSQL_MODERATION_HOST=${MYSQL_MODERATION_HOST}
      - MYSQL_MODERATION_PORT=${MYSQL_MODERATION_PORT}
      - MYSQL_MODERATION_USERNAME=${MYSQL_MODERATION_USERNAME}
      - MYSQL_MODERATION_PASSWORD=${MYSQL_MODERATION_PASSWORD}
    depends_on:
      - mysql-moderation
      - nacos
      - rmqnamesrv
    networks: [nabu-net]

  nabu-stat-service:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-stat-service
    container_name: nabu-stat-service
