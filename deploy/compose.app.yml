  nabu-web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        MODULE: nabu-web
    container_name: nabu-web
    restart: unless-stopped
    ports:
      - "18080:18080"
    environment:
      - NACOS_ADDRESS=${NACOS_ADDRESS}
      - SENTINEL_DASHBOARD=${SENTINEL_DASHBOARD}
    depends_on:
      - nacos
    networks: [nabu-net]

networks:
  nabu-net:
    name: nabu-net
    driver: bridge
