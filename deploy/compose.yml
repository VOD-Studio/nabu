# =====================================================================================
# Nabu 顶层 Compose 文件：仅声明公共网络。
# 实际服务定义拆分在：
#   compose.infrastructure.yml   MySQL / Redis / Elasticsearch / RustFS
#   compose.middleware.yml       Nacos / Sentinel / RocketMQ / Seata / Canal / Higress
#   compose.observability.yml    OpenTelemetry / Prometheus / Grafana / Loki / Tempo
#   compose.app.yml              13 个 Java 微服务
#
# 启动方式（务必按顺序传入 -f，中间件依赖基础设施，应用依赖中间件）：
#   docker compose \
#     --env-file deploy/.env \
#     -f deploy/compose.yml \
#     -f deploy/compose.infrastructure.yml \
#     -f deploy/compose.middleware.yml \
#     -f deploy/compose.observability.yml \
#     -f deploy/compose.app.yml \
#     up -d
#
# 或直接用 deploy/scripts/up.sh / down.sh 封装好的脚本。
# =====================================================================================
name: nabu

networks:
  nabu-net:
    name: nabu-net
    driver: bridge
