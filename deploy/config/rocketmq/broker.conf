brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
# 单机部署：使用容器服务名，仅供 docker compose 内部网络访问；
# 如果需要在宿主机直接用 Java 服务（不进容器）连接 RocketMQ，
# 请改成宿主机可达的真实 IP（不能是 127.0.0.1 或容器内部 IP）。
brokerIP1 = rmqbroker
listenPort = 10911
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true
